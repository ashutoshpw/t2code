name: Rebrand check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-rebrand.ts --tree
